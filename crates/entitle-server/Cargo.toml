[package]
name = "entitle-server"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "entitle"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
axum.workspace = true
base64.workspace = true
chacha20poly1305.workspace = true
chrono.workspace = true
clap.workspace = true
entitle-apple.workspace = true
entitle-core.workspace = true
entitle-creem.workspace = true
entitle-google.workspace = true
getrandom.workspace = true
hex.workspace = true
hmac.workspace = true
http-body-util.workspace = true
oxidt-egress = { git = "https://github.com/oxidt/oxidt-kit", rev = "b2e462619b6b5afe8dd72a3f14a16efde1156f47", version = "0.1.0", features = ["tokio"] }
# Theme and component classes for the dashboard; build.rs imports its CSS.
oxidt-ui = { git = "https://github.com/oxidt/oxidt-ui", tag = "v0.3.0" }
oxidt-mcp-oauth = { git = "https://github.com/oxidt/oxidt-kit", rev = "b2e462619b6b5afe8dd72a3f14a16efde1156f47", version = "0.1.0" }
jsonwebtoken = { version = "11.1.0", default-features = false, features = ["aws_lc_rs"] }
reqwest.workspace = true
rmcp = { version = "3.5", default-features = false, features = ["server", "macros", "transport-streamable-http-server"] }
schemars = "1.2"
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
sqlx.workspace = true
subtle.workspace = true
thiserror.workspace = true
tokio.workspace = true
topcoat.workspace = true
tower.workspace = true
tower-http.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true

[build-dependencies]
topcoat = { version = "=0.12.1", default-features = false, features = ["tailwind"] }

[dev-dependencies]
entitle-core = { workspace = true, features = ["testing", "ts"] }
ts-rs.workspace = true
