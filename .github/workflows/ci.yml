name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: entitle
          POSTGRES_PASSWORD: entitle
          POSTGRES_DB: entitle
        ports:
          - 55433:5432
        options: >-
          --health-cmd "pg_isready -U entitle -d entitle"
          --health-interval 2s --health-timeout 3s --health-retries 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # Also regenerates sdk/js/src/generated (export_bindings test).
      - run: cargo test --workspace
      - name: Generated SDK types are up to date
        run: |
          git add -N sdk/js/src/generated
          git diff --exit-code -- sdk/js/src/generated

  sdk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/js
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test test
      - run: bun run build

  capacitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      # The plugin builds against the local @oxidt/entitle (file:../js), which needs its dist/.
      - name: Build @oxidt/entitle
        working-directory: sdk/js
        run: bun install --frozen-lockfile && bun run build
      - working-directory: sdk/capacitor
        run: bun install --frozen-lockfile
      - working-directory: sdk/capacitor
        run: bun run typecheck
      - working-directory: sdk/capacitor
        run: bun test test
      - working-directory: sdk/capacitor
        run: bun run build

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
      # settings.gradle includes ../node_modules/@capacitor/android.
      - working-directory: sdk/capacitor
        run: bun install --frozen-lockfile
      - working-directory: sdk/capacitor/android
        run: ./gradlew --no-daemon assembleDebug
