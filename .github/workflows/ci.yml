name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: entitle
          POSTGRES_PASSWORD: entitle
          POSTGRES_DB: entitle
        ports:
          - 55433:5432
        options: >-
          --health-cmd "pg_isready -U entitle -d entitle"
          --health-interval 2s --health-timeout 3s --health-retries 30
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # Also regenerates sdk/js/src/generated (export_bindings test).
      - run: cargo test --workspace
      - name: Generated SDK types are up to date
        run: |
          git add -N sdk/js/src/generated
          git diff --exit-code -- sdk/js/src/generated

  sdk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/js
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test test
      - run: bun run build

  capacitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      # The plugin builds against the local @oxidt/entitle (file:../js), which needs its dist/.
      - name: Build @oxidt/entitle
        working-directory: sdk/js
        run: bun install --frozen-lockfile && bun run build
      - working-directory: sdk/capacitor
        run: bun install --frozen-lockfile
      - working-directory: sdk/capacitor
        run: bun run typecheck
      - working-directory: sdk/capacitor
        run: bun test test
      - working-directory: sdk/capacitor
        run: bun run build

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
      # settings.gradle includes ../node_modules/@capacitor/android.
      - working-directory: sdk/capacitor
        run: bun install --frozen-lockfile
      - working-directory: sdk/capacitor/android
        run: ./gradlew --no-daemon assembleDebug
