name: entitle

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: entitle
      POSTGRES_PASSWORD: entitle
      POSTGRES_DB: entitle
    ports:
      - "127.0.0.1:55433:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U entitle -d entitle"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Full stack: export ENTITLE_ADMIN_TOKEN and ENTITLE_ENCRYPTION_KEY (see README), then
  # `docker compose --profile app up --build`. Both are passed through from your shell, never
  # defaulted; entitle refuses to start without them. The Postgres credentials above are dev-only.
  entitle:
    profiles: ["app"]
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgres://entitle:entitle@postgres:5432/entitle
      - ENTITLE_ADMIN_TOKEN
      - ENTITLE_ENCRYPTION_KEY
      - RUST_LOG=info
    ports:
      - "127.0.0.1:8080:8080"

volumes:
  pgdata:
