name: entitle

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: entitle
      POSTGRES_PASSWORD: entitle
      POSTGRES_DB: entitle
    ports:
      - "127.0.0.1:55433:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U entitle -d entitle"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Full stack: `docker compose --profile app up --build`
  entitle:
    profiles: ["app"]
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://entitle:entitle@postgres:5432/entitle
      ENTITLE_ADMIN_TOKEN: dev-admin-token-change-me-0123456789abcdef
      ENTITLE_ENCRYPTION_KEY: ZGV2LW9ubHktZW5jcnlwdGlvbi1rZXktMzJieXRlcyE=
      RUST_LOG: info
    ports:
      - "127.0.0.1:8080:8080"

volumes:
  pgdata:
