<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>entitle example</title>
    <style>
      body { font: 16px system-ui, sans-serif; margin: 0; padding: calc(env(safe-area-inset-top) + 16px) 16px 16px; }
      button { font: inherit; padding: 10px 16px; margin: 4px 8px 4px 0; }
      #status.on { color: #16794a; }
      #status.off { color: #b3261e; }
      code { word-break: break-all; }
      #log { background: #f2f2f2; padding: 8px; min-height: 8em; white-space: pre-wrap; font-size: 13px; }
    </style>
  </head>
  <body>
    <h1>entitle example</h1>
    <p>Entitlement <code id="entitlement"></code>: <strong id="status">…</strong></p>
    <p>App user id: <code id="user">…</code></p>
    <button id="buy" disabled>Buy</button>
    <button id="restore" disabled>Restore purchases</button>
    <h2>Log</h2>
    <pre id="log"></pre>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
